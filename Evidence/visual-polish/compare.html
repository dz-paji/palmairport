<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALM BAY · 画面精修对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8efea;color:#203b49;font:16px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:40px 24px}h1{font-size:32px;margin:0}h2{font-size:22px;margin:30px 0 12px}p{color:#516b70}small{color:#516b70}.compare{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#203b49}.compare img{position:absolute;width:100%;height:100%;object-fit:contain}.compare .before{clip-path:inset(0 calc(100% - var(--split)) 0 0)}.line{position:absolute;left:var(--split);top:0;bottom:0;border-left:2px solid white;pointer-events:none}.tag{position:absolute;top:12px;background:#203b49db;color:white;padding:4px 12px;border-radius:8px}.tag.right{right:12px}.tag.left{left:12px}.control{display:flex;align-items:center;gap:16px;margin:10px 0 28px}.control input{width:100%;accent-color:#2a9d8f}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}figure{margin:0;background:#f7f5ee;border-radius:16px;overflow:hidden}figure img{width:100%;display:block}figcaption{padding:14px 20px}@media(max-width:650px){main{padding:24px 12px}.grid{grid-template-columns:1fr}h1{font-size:26px}}
</style>
<main><small>PALM BAY / 1.0.8</small><h1>画面精修对照</h1><p>拖动滑块查看同一场景的前后变化。上方为实际编辑器游戏画面；下方近景直接使用游戏运行时的模型生成器。</p>
<h2>机场班岗</h2><div class="compare" id="airport" style="--split:50%"><img src="after/m1-ingame-16x9.png" alt="精修后机场"><img class="before" src="before/m1-ingame-16x9.png" alt="精修前机场"><span class="line"></span><span class="tag left">之前</span><span class="tag right">现在</span></div><label class="control">对照<input aria-label="机场前后对照" type="range" min="0" max="100" value="50" oninput="document.getElementById('airport').style.setProperty('--split',this.value+'%')"></label>
<h2>机舱大厅</h2><div class="compare" id="cabin" style="--split:50%"><img src="after/m2-lobby-main.png" alt="精修后机舱"><img class="before" src="before/m2-lobby-main.png" alt="精修前机舱"><span class="line"></span><span class="tag left">之前</span><span class="tag right">现在</span></div><label class="control">对照<input aria-label="机舱前后对照" type="range" min="0" max="100" value="50" oninput="document.getElementById('cabin').style.setProperty('--split',this.value+'%')"></label>
<h2>局内模型近景</h2><div class="grid"><figure><img src="after/model-aircraft.png" alt="飞机实际模型"><figcaption>飞机</figcaption></figure><figure><img src="after/model-meals.png" alt="餐车实际模型"><figcaption>餐食配送车</figcaption></figure><figure><img src="after/model-baggage.png" alt="行李车实际模型"><figcaption>行李牵引车</figcaption></figure><figure><img src="after/model-fuel.png" alt="油车实际模型"><figcaption>燃油车</figcaption></figure></div>
<p><small>近景使用统一光照与无 UI 视角以便检查几何，不是概念图。批处理画面中的 FPS 不能作为设备性能实测；本轮未进行 Android 真机验收。</small></p></main></html>
